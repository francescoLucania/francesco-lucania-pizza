@if (!link) {
<button
  class="neo-ui-button"
  [class.neo-ui-button--theme-secondary]="theme === 'secondary'"
  [class.neo-ui-button--theme-brand]="theme === 'brand'"
  [class.neo-ui-button--size-small]="size === 'small'"
  [class.neo-ui-button--size-large]="size === 'large'"
  [class.neo-ui-button--full-width]="fullWidth"
  [type]="buttonType"
  [disabled]="disabled"
  [attr.aria-label]="ariaLabel"
  [attr.tabindex]="tabIndex"
>
  @if (label()) {
  {{ label() }}
  } @else {
  <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  }
</button>
} @else {
<a
  class="neo-ui-button"
  [routerLink]="link"
  [target]="target"
  [class.neo-ui-button--theme-secondary]="theme === 'secondary'"
  [class.neo-ui-button--theme-brand]="theme === 'brand'"
  [class.neo-ui-button--size-small]="size === 'small'"
  [class.neo-ui-button--size-large]="size === 'large'"
  [class.neo-ui-button--full-width]="fullWidth"
  [type]="buttonType"
  [attr.aria-label]="ariaLabel"
  [attr.tabindex]="tabIndex"
>
  @if (label()) {
  {{ label() }}
  } @else {
  <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  }
</a>
}

<ng-template #contentTemplate>
  <ng-content></ng-content>
</ng-template>
