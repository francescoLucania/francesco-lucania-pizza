@if (!link()) {
<button
  class="pizza-ui-button"
  [class.pizza-ui-button--theme-secondary]="theme() === 'secondary'"
  [class.pizza-ui-button--theme-brand]="theme() === 'brand'"
  [class.pizza-ui-button--size-small]="size() === 'small'"
  [class.pizza-ui-button--size-large]="size() === 'large'"
  [class.pizza-ui-button--full-width]="fullWidth()"
  [class.pizza-ui-button--full-card-click]="fullCardClick()"
  [type]="buttonType()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  [attr.tabindex]="tabIndex()"
>
  @if (label()) {
  {{ label() }}
  } @else {
  <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  }
</button>
} @else {
<a
  class="pizza-ui-button"
  [routerLink]="link()"
  [target]="target()"
  [class.pizza-ui-button--theme-secondary]="theme() === 'secondary'"
  [class.pizza-ui-button--theme-brand]="theme() === 'brand'"
  [class.pizza-ui-button--size-small]="size() === 'small'"
  [class.pizza-ui-button--size-large]="size() === 'large'"
  [class.pizza-ui-button--full-width]="fullWidth()"
  [class.pizza-ui-button--full-card-click]="fullCardClick()"
  [type]="buttonType()"
  [attr.aria-label]="ariaLabel()"
  [attr.tabindex]="tabIndex()"
>
  @if (label()) {
  {{ label() }}
  } @else {
  <ng-container *ngTemplateOutlet="contentTemplate"></ng-container>
  }
</a>
}

<ng-template #contentTemplate>
  <ng-content></ng-content>
</ng-template>
