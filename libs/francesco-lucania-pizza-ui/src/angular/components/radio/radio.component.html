<label class="neo-ui-radio" [for]="computedRadioId">
  <input
    class="neo-ui-radio__input"
    type="radio"
    role="radio"
    [attr.aria-checked]="_checked || value() === radioValue()"
    [checked]="_checked || value() === radioValue()"
    [disabled]="disabled()"
    (change)="onChange($event)"
    (blur)="notifyBlurEvent($event)"
    (focus)="notifyFocusEvent($event)"
    [id]="computedRadioId"
    [name]="name() ? name() : undefined"
    [attr.value]="radioValue()"
    [required]="required()"
  />
  <span class="neo-ui-radio__view"> </span>
  <span class="neo-ui-radio__label">
    {{ label() }}
  </span>
  <span class="neo-ui-radio__focus-visible"> </span>
</label>
